
<!DOCTYPE html>
<html lang="om">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MELBA Daily Kaizen Checklist</title>

  <style>
    :root {
      --navy:#102d4f;
      --blue:#174a78;
      --gold:#d6a63b;
      --light:#f2f5f9;
      --green:#16834a;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      padding:18px;
      background:var(--light);
      font-family:Arial,sans-serif;
      color:#253247;
    }

    .container { max-width:1050px; margin:auto; }

    header {
      background:var(--navy);
      color:white;
      text-align:center;
      padding:25px;
      border-bottom:5px solid var(--gold);
      border-radius:12px;
    }

    header h1 { margin:0 0 8px; font-size:25px; }
    header p { margin:5px; }

    .actions {
      display:flex;
      justify-content:flex-end;
      margin:15px 0;
    }

    .panel {
      background:white;
      padding:22px;
      border-radius:10px;
      margin-bottom:18px;
      box-shadow:0 2px 9px #0000000d;
    }

    h2 { color:var(--navy); }

    .grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }

    label {
      display:block;
      font-weight:bold;
      margin-bottom:7px;
    }

    input, select {
      width:100%;
      padding:11px;
      border:1px solid #cbd5e1;
      border-radius:6px;
      font-size:15px;
    }

    .question {
      border:1px solid #e1e7ef;
      border-radius:8px;
      padding:15px;
      margin-bottom:12px;
    }

    .question-title {
      font-weight:bold;
      line-height:1.5;
      margin-bottom:12px;
    }

    .number { color:var(--gold); }

    .answers {
      display:flex;
      gap:25px;
      margin-bottom:12px;
    }

    .answers label {
      display:flex;
      align-items:center;
      gap:7px;
      margin:0;
    }

    .answers input { width:auto; }

    .summary {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:18px;
    }

    .summary div {
      background:#f1f5f9;
      padding:15px;
      text-align:center;
      border-radius:8px;
    }

    .summary strong {
      display:block;
      font-size:24px;
      color:var(--navy);
      margin-top:5px;
    }

    button, .link {
      border:0;
      border-radius:6px;
      padding:12px 18px;
      cursor:pointer;
      font-weight:bold;
      text-decoration:none;
      display:inline-block;
    }

    .blue { background:var(--blue); color:white; }
    .gold { background:var(--gold); color:#17243a; }
    .submit {
      background:var(--green);
      color:white;
      padding:14px 35px;
      font-size:16px;
    }

    .submit:disabled { opacity:.6; cursor:not-allowed; }

    .submit-area { text-align:center; padding:15px; }

    #message {
      display:none;
      padding:14px;
      border-radius:7px;
      margin:15px 0;
      font-weight:bold;
    }

    .success { display:block!important; background:#d4edda; color:#155724; }
    .error { display:block!important; background:#f8d7da; color:#721c24; }

    footer { text-align:center; padding:18px; color:#64748b; }

    @media(max-width:700px) {
      .grid,.summary { grid-template-columns:1fr; }
      body { padding:9px; }
      header h1 { font-size:20px; }
    }

    @media print {
      .actions,.submit-area,footer { display:none!important; }
      body { background:white; }
      .panel,.question { box-shadow:none; break-inside:avoid; }
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <h1>MELBA DAILY KAIZEN CHECKLIST</h1>
    <p>MELBA PRINTING, PUBLISHING & PACKAGING S.C.</p>
    <p>Technical Directorate</p>
  </header>

  <div class="actions">
    <a class="link blue" href="https://script.google.com/macros/s/AKfycbyTCbS-JnxALxiIiOFnwE0izBIbMo0KZ_0WljOMFxGfDudH4r9967ivclSMR4alt4oE/exec">
      View Records Dashboard
    </a>
  </div>

  <form id="kaizenForm">

    <section class="panel">
      <h2>General Information</h2>

      <div class="grid">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <div>
          <label for="department">Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option>Production Directorate</option>
            <option>Technical Directorate</option>
            <option>Finance</option>
            <option>General Service</option>
            <option>Marketing</option>
            <option>Human Resource</option>
            <option>Procurement</option>
          </select>
        </div>

        <div>
          <label for="signature">Name / Signature</label>
          <input id="signature" type="text"
            placeholder="Enter your name" required>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Daily Kaizen Checklist</h2>
      <p>Answer all 20 questions using Eeyyee or Miti.</p>

      <div id="questions"></div>

      <div class="summary">
        <div>Eeyyee<strong id="yesCount">0</strong></div>
        <div>Miti<strong id="noCount">0</strong></div>
        <div>Score<strong id="score">0%</strong></div>
      </div>
    </section>

    <div id="message"></div>

    <div class="submit-area">
      <button type="submit" class="submit" id="submitBtn">
        Submit Checklist
      </button>
    </div>

  </form>

  <footer>MELBA Technical Directorate | Daily Kaizen Monitoring System</footer>
</div>

<script>
const questions = [
  "Bakki hojii qulqulluu fi sirrii ta'uu isaa mirkaneessuu",
  "Meeshaaleen hojii barbaachisoo ta'an bakka isaanii irratti argamuu",
  "Meeshaalee hin barbaachifne bakka hojii irraa qulqulleessuu",
  "Faayilootaa fi dokumeentoota sirnaan qindeessuu",
  "Hojii guyyaa sanaaf karoorfame adda baasuu",
  "Hojii dursa kennamuuf qabu adda baasuu",
  "Hojiiwwan yeroo isaanii eeganii raawwatamuu isaanii hordofuu",
  "Yeroo hojii sirnaan fayyadamuu",
  "Qisaasama yeroo, meeshaa fi qabeenyaa xiqqeessuu",
  "Rakkoo hojii keessatti mul'ate adda baasuu",
  "Sababa rakkoo sanaa adda baasuu",
  "Furmaata rakkoo sanaaf tarkaanfii fudhachuu",
  "Hojii har'aa kan kaleessaa caalaa fooyyeessuuf yaada haaraa qabaachuu",
  "Yaada fooyya'iinsaa hojjettoota irraa walitti qabu",
  "Tajaajila kennamu irratti qulqullinaa fi saffisa mirkaneessuu",
  "Komii ykn yaada maamilaa/hojii waliin walqabatu galmeessuu",
  "Hojiiwwan raawwataman ragaan isaanii sirnaan qabamuu",
  "Seera, qajeelfama fi tartiiba hojii kabajuu",
  "Hojii guyyaa sanaa madaaluu",
  "Boruuf hojii fooyya'aa fi tarkaanfii itti aanu murteessuu"
];

const questionContainer = document.getElementById("questions");

questions.forEach((question,index) => {
  const n = index + 1;
  const div = document.createElement("div");
  div.className = "question";

  div.innerHTML = `
    <div class="question-title">
      <span class="number">${n}.</span> ${question}
    </div>
    <div class="answers">
      <label><input type="radio" name="q${n}" value="Eeyyee" required> Eeyyee</label>
      <label><input type="radio" name="q${n}" value="Miti"> Miti</label>
    </div>
    <input type="text" id="comment${n}" placeholder="Comment / Yaada dabalataa (optional)">
  `;

  questionContainer.appendChild(div);
});

document.getElementById("date").value =
  new Date().toLocaleDateString("en-CA");

questionContainer.addEventListener("change", updateSummary);

function updateSummary() {
  let yes = 0;
  let no = 0;

  for (let i=1; i<=20; i++) {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (selected?.value === "Eeyyee") yes++;
    if (selected?.value === "Miti") no++;
  }

  document.getElementById("yesCount").textContent = yes;
  document.getElementById("noCount").textContent = no;
  document.getElementById("score").textContent = yes * 5 + "%";
}

function showMessage(message,type) {
  const box = document.getElementById("message");
  box.textContent = message;
  box.className = type;
  box.scrollIntoView({behavior:"smooth",block:"center"});
}

document.getElementById("kaizenForm").addEventListener("submit",function(event) {
  event.preventDefault();

  const answers = [];

  for (let i=1; i<=20; i++) {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);

    if (!selected) {
      showMessage("Please answer question " + i + ".", "error");
      return;
    }

    answers.push({
      answer:selected.value,
      comment:document.getElementById("comment"+i).value.trim()
    });
  }

  const payload = {
    date:document.getElementById("date").value,
    department:document.getElementById("department").value,
    signature:document.getElementById("signature").value.trim(),
    answers:answers
  };

  const button = document.getElementById("submitBtn");
  button.disabled = true;
  button.textContent = "Submitting...";

  google.script.run
    .withSuccessHandler(function(result) {
      button.disabled = false;
      button.textContent = "Submit Checklist";

      if (!result || !result.success) {
        showMessage("Submission failed.", "error");
        return;
      }

      showMessage(
        "Submitted successfully. ID: " + result.submissionId +
        " | Score: " + result.score + "/100 (" + result.percentage + ")",
        "success"
      );

      document.getElementById("kaizenForm").reset();
      document.getElementById("date").value =
        new Date().toLocaleDateString("en-CA");
      updateSummary();
    })
    .withFailureHandler(function(error) {
      button.disabled = false;
      button.textContent = "Submit Checklist";
      showMessage("Error: " + error.message, "error");
    })
    .saveKaizen(payload);
});
</script>
</body>
</html>
