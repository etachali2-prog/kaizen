
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELBA Daily Kaizen Checklist</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #edf2f7;
    font-family: Arial, sans-serif;
    color: #1e293b;
}

.container {
    max-width: 1150px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.header {
    text-align: center;
    border-bottom: 3px solid #123b63;
    padding-bottom: 15px;
    margin-bottom: 25px;
}

.header h2 {
    color: #123b63;
    margin-bottom: 8px;
}

.header h3 {
    margin-bottom: 5px;
}

.header p {
    color: #64748b;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.field label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.field input, .field select, .field textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    font-family: Arial, sans-serif;
}

.field textarea {
    min-height: 75px;
    resize: vertical;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #123b63;
    color: white;
    padding: 12px;
}

td {
    border: 1px solid #dbe2ea;
    padding: 12px 8px;
    text-align: center;
}

td.question {
    text-align: left;
    width: 70%;
}

tbody tr:nth-child(even) {
    background: #f1f5f9;
}

input[type=checkbox] {
    width: 19px;
    height: 19px;
    accent-color: #087a50;
    cursor: pointer;
}

.score {
    font-weight: bold;
    color: #087a50;
}

.summary {
    margin-top: 20px;
    padding: 20px;
    background: #eaf2f8;
    border-radius: 8px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 15px;
}

.summary div {
    font-weight: bold;
}

.summary strong {
    color: #087a50;
    font-size: 22px;
}

.buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.submit {
    background: #087a50;
    color: white;
}

.print {
    background: #123b63;
    color: white;
}

.reset {
    background: #64748b;
    color: white;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#message {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 6px;
    overflow-wrap: anywhere;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

@media(max-width:700px) {
    body {
        padding: 8px;
    }

    .container {
        padding: 13px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .summary {
        flex-direction: column;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .container {
        box-shadow: none;
        padding: 10px;
    }

    .buttons, #message {
        display: none !important;
    }

    .table-wrapper {
        overflow: visible;
    }

    table {
        min-width: 0;
        font-size: 10px;
    }

    th, td {
        padding: 6px 4px;
    }

    .details input, .details select, .details textarea {
        border: none;
        padding-left: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>MELBA PRINTING, PUBLISHING & PACKAGING S.C.</h2>
        <h3>DAILY KAIZEN CHECKLIST</h3>
        <p>
            Cheekliistii Hojii Irra Oolmaa Kaayizenii
            Guyyaa Guyyaan Ittiin Hordofamu
        </p>
    </div>

    <form id="kaizenForm">

        <!-- EMPLOYEE INFORMATION -->

        <div class="details">

            <div class="field">
                <label>Guyyaa / Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="field">
                <label>Kutaa Hojii / Department</label>

                <select id="department" required>
                    <option value="">Select Department</option>
                    <option>Production Directorate</option>
                    <option>Technical Directorate</option>
                    <option>Finance</option>
                    <option>General Service</option>
                    <option>Marketing</option>
                    <option>Human Resource</option>
                    <option>Procurement</option>
                </select>
            </div>

            <div class="field">
                <label>Maqaa Hojjetaa / Employee Name</label>
                <input type="text" id="employee"
                       placeholder="Enter employee name" required>
            </div>

            <div class="field">
                <label>Yaada / Comment</label>
                <textarea id="comment"
                    placeholder="Enter comments or improvement suggestions"></textarea>
            </div>

        </div>

        <!-- CHECKLIST TABLE -->

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Checklist / Gaaffii Hordoffii</th>
                        <th>Yes</th>
                        <th>No</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <tbody id="checklistBody"></tbody>

            </table>

        </div>

        <!-- SCORE SUMMARY -->

        <div class="summary">

            <div>
                Total Score:
                <strong id="total">0</strong> / 20
            </div>

            <div>
                Percentage:
                <strong id="percentage">0%</strong>
            </div>

            <div>
                Answered:
                <strong id="answered">0</strong> / 20
            </div>

        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button type="submit" class="submit" id="submitBtn">
                Submit to Google Sheets
            </button>

            <button type="button" class="print"
                    onclick="window.print()">
                Print / Save PDF
            </button>

            <button type="reset" class="reset">
                Reset Form
            </button>

        </div>

        <div id="message"></div>

    </form>

</div>

<script>

// ========================================
// GOOGLE APPS SCRIPT WEB APP URL
// ========================================

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxE7U4hXfrErGIMkHw-byoZccAbfZl4NJQwNbS4LXNhTkqL9yWDXIPhTfPxhNG3sSV/exec";


// ========================================
// CHECKLIST QUESTIONS
// ========================================

const questions = [

"Bakki hojii qulqulluu fi sirrii ta'uu isaa mirkaneessuu",

"Meeshaaleen hojii barbaachisoo ta'an bakka isaanii irratti argamuu",

"Meeshaalee hin barbaachifne bakka hojii irraa qulqulleessuu",

"Faayilootaa fi dokumeentoota sirnaan qindeessuu",

"Hojii guyyaa sanaaf karoorfame adda baasuu",

"Hojii dursa kennamuuf qabu adda baasuu",

"Hojiiwwan yeroo isaanii eeganii raawwatamuu isaanii hordofuu",

"Yeroo hojii sirnaan fayyadamuu",

"Qisaasama yeroo, meeshaa fi qabeenyaa xiqqeessuu",

"Rakkoo hojii keessatti mul'ate adda baasuu",

"Sababa rakkoo sanaa adda baasuu",

"Furmaata rakkoo sanaaf tarkaanfii fudhachuu",

"Hojii har'aa kan kaleessaa caalaa fooyyeessuuf yaada haaraa qabaachuu",

"Yaada fooyya'iinsaa hojjettoota irraa walitti qabu",

"Tajaajila kennamu irratti qulqullinaa fi saffisa mirkaneessuu",

"Komii ykn yaada maamilaa/hojii waliin walqabatu galmeessuu",

"Hojiiwwan raawwataman ragaan isaanii sirnaan qabamuu",

"Seera, qajeelfama fi tartiiba hojii kabajuu",

"Hojii guyyaa sanaa madaaluu",

"Boruuf hojii fooyya'aa fi tarkaanfii itti aanu murteessuu"

];


// ========================================
// GENERATE CHECKLIST TABLE
// ========================================

const tbody = document.getElementById("checklistBody");

questions.forEach((question, index) => {

    const row = document.createElement("tr");

    row.innerHTML = `

        <td>${index + 1}</td>

        <td class="question">${question}</td>

        <td>
            <input type="checkbox"
                id="yes${index}"
                onchange="selectAnswer(${index}, 'Yes')">
        </td>

        <td>
            <input type="checkbox"
                id="no${index}"
                onchange="selectAnswer(${index}, 'No')">
        </td>

        <td class="score" id="score${index}">0</td>

    `;

    tbody.appendChild(row);

});


// ========================================
// STORE ANSWERS
// ========================================

let answers = new Array(20).fill("");


// ========================================
// YES / NO SELECTION
// ========================================

function selectAnswer(index, value) {

    const yes = document.getElementById("yes" + index);

    const no = document.getElementById("no" + index);

    if (value === "Yes") {

        if (yes.checked) {

            no.checked = false;

            answers[index] = "Yes";

        } else {

            answers[index] = "";

        }

    } else {

        if (no.checked) {

            yes.checked = false;

            answers[index] = "No";

        } else {

            answers[index] = "";

        }

    }

    calculateScore();

}


// ========================================
// AUTOMATIC SCORE CALCULATION
// YES = 1, NO = 0
// ========================================

function calculateScore() {

    let total = 0;

    let answered = 0;

    questions.forEach((question, index) => {

        let score = answers[index] === "Yes" ? 1 : 0;

        if (answers[index] !== "") {
            answered++;
        }

        total += score;

        document.getElementById("score" + index).textContent = score;

    });

    let percentage = (total / 20) * 100;

    document.getElementById("total").textContent = total;

    document.getElementById("percentage").textContent =
        percentage.toFixed(1) + "%";

    document.getElementById("answered").textContent = answered;

}


// ========================================
// MESSAGE DISPLAY
// ========================================

function showMessage(message, type) {

    const box = document.getElementById("message");

    box.style.display = "block";

    box.className = type;

    box.textContent = message;

}


// ========================================
// SUBMIT TO GOOGLE SHEETS
// ONE SUBMISSION = ONE ROW
// ========================================

document.getElementById("kaizenForm").addEventListener(
"submit", async function(event) {

    event.preventDefault();

    if (SCRIPT_URL.includes("PASTE_YOUR")) {

        showMessage(
            "Please enter your Google Apps Script Web App URL.",
            "error"
        );

        return;

    }

    // Check all questions

    const unanswered = answers.filter(
        answer => answer === ""
    ).length;

    if (unanswered > 0) {

        showMessage(
            "Please answer all 20 checklist questions.",
            "error"
        );

        return;

    }

    // Prepare 20 answers

    const items = questions.map((question, index) => ({

        question: question,

        answer: answers[index],

        score: answers[index] === "Yes" ? 1 : 0

    }));


    // Prepare complete submission

    const data = {

        date: document.getElementById("date").value,

        department: document.getElementById("department").value,

        employee: document.getElementById("employee").value,

        comment: document.getElementById("comment").value,

        items: items

    };


    const button = document.getElementById("submitBtn");

    button.disabled = true;

    button.textContent = "Submitting...";


    try {

        const response = await fetch(SCRIPT_URL, {

            method: "POST",

            headers: {

                "Content-Type": "text/plain;charset=utf-8"

            },

            body: JSON.stringify(data)

        });


        const result = await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.message || "Submission failed"
            );

        }


        showMessage(

            "Successfully submitted to Google Sheets! " +

            "Total Score: " + result.totalScore + "/20. " +

            "Percentage: " + result.percentage + "%.",

            "success"

        );


    } catch (error) {

        showMessage(

            "Submission error: " + error.message +

            ". Check your internet connection and Apps Script deployment.",

            "error"

        );

    } finally {

        button.disabled = false;

        button.textContent = "Submit to Google Sheets";

    }

});


// ========================================
// RESET FORM
// ========================================

document.getElementById("kaizenForm").addEventListener(
"reset", function() {

    setTimeout(function() {

        answers = new Array(20).fill("");

        calculateScore();

        document.getElementById("message").style.display = "none";

    }, 0);

});


// ========================================
// AUTOMATIC DATE
// ========================================

document.getElementById("date").value =
    new Date().toLocaleDateString("en-CA");

</script>

</body>
</html>
